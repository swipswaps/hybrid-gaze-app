apiVersion: 1
providers:
  - name: 'FastAPI Telemetry Dashboards'
    orgId: 1
    folder: 'FastAPI Gaze System'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
