version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
