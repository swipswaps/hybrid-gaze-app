global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'pager-webhook'

receivers:
  - name: 'pager-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:9093/webhook'
        send_resolved: true
