version: '3.8'
services:
  backend:
    build: .
    env_file:
      - .env.production
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/video1:/dev/video1"
    volumes:
      - production_data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  production_data:
    driver: local
